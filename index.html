<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101421"><title>DON'T HIT SH!T</title><style>*{box-sizing:border-box}body{margin:0;background:#101421;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top:env(safe-area-inset-top,12px);left:0;right:0;display:flex;justify-content:space-between;padding:12px 20px;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #000}#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0d18bd;text-align:center;padding:20px}#box{max-width:380px;width:100%;background:#191e30;border:2px solid #3a425b;border-radius:22px;padding:26px 18px;box-shadow:0 18px 70px #0009}h1{font-size:clamp(30px,9vw,46px);margin:0 0 8px;color:#ffde55;line-height:1.05}p{color:#c2c9d8;line-height:1.5}button{border:0;border-radius:14px;padding:15px 22px;font-weight:900;font-size:18px;background:#ffdb45;color:#141923;cursor:pointer;width:100%;margin-top:9px}button.alt{background:#333c53;color:white;font-size:15px}small{color:#a9b3c7}#toast{position:absolute;top:23%;width:100%;text-align:center;font-size:28px;font-weight:1000;pointer-events:none;color:#ffe75c;text-shadow:0 3px 8px #000;opacity:0}#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}#controls button{pointer-events:auto;width:42%;opacity:.5;font-size:25px}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">SCORE 0</span><span id="coins">🪙 0</span><span id="best">BEST 0</span></div><div id="toast"></div><div id="controls"><button id="left">◀</button><button id="right">▶</button></div><div id="panel"><div id="box"><h1>DON'T HIT SH!T</h1><p>Swipe to steer (()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),panel=document.querySelector('#panel'),box=document.querySelector('#box'),hudScore=document.querySelector('#score'),hudCoins=document.querySelector('#coins'),hudBest=document.querySelector('#best'),toast=document.querySelector('#toast'),controls=document.querySelector('#controls');let W=0,H=0,DPR=1,roadX=0,roadW=0,laneW=0,playerLane=1,playerPos=1,targetPos=1,stage=0,selectedStage=0,objects=[],particles=[],running=false,score=0,coinRun=0,elapsed=0,spawn=0,last=0,speed=270,roadOffset=0,gameCount=0,adCount=0,adTime=0,near=0,vehicle=0;const prices=[0,50,150,400],colors=['#00e7ef','#ff4b62','#b16aff','#ffd54d'];const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};let bank=read('dh_bank',0),best=read('dh_best',0),owned=read('dh_owned',[true,false,false,false]);let worlds=read('dh_worlds',[true,false,false,false]);selectedStage=Math.max(0,Math.min(3,read('dh_world',0)));if(!worlds[selectedStage])selectedStage=0;hudBest.textContent='BEST '+best;hudCoins.textContent='🪙 '+bank;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);roadW=Math.min(W*.82,420);roadX=(W-roadW)/2;laneW=roadW/3}addEventListener('resize',resize);resize();function pop(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(pop.t);pop.t=setTimeout(()=>toast.style.opacity=0,700)}function laneX(l){return roadX+laneW*(l+.5)}function car(x,y,color,enemy=false){if(stage>0){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.strokeStyle='#ffffff80';ctx.lineWidth=2;ctx.beginPath();if(stage===1){ctx.moveTo(0,-33);ctx.quadraticCurveTo(24,-12,18,29);ctx.lineTo(-18,29);ctx.quadraticCurveTo(-24,-12,0,-33)}else if(stage===2||!enemy){ctx.moveTo(0,-34);ctx.lineTo(8,-9);ctx.lineTo(25,17);ctx.lineTo(8,12);ctx.lineTo(9,30);ctx.lineTo(-9,30);ctx.lineTo(-8,12);ctx.lineTo(-25,17);ctx.lineTo(-8,-9)}else{for(let i=0;i<9;i++){let a=i*Math.PI*2/9,rad=i%2?22:29;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}}ctx.closePath();ctx.fill();ctx.stroke();if(stage!==3||!enemy){ctx.fillStyle='#14283e';ctx.fillRect(-5,-14,10,17);ctx.fillStyle=stage===1?'#c7f4ff':'#ffbd54';ctx.fillRect(-4,30,8,12)}ctx.restore();return;}let w=Math.min(42,laneW*.49),h=66;ctx.save();ctx.translate(x,y);ctx.fillStyle='#070a12';ctx.fillRect(-w/2-5,-h/2+8,6,15);ctx.fillRect(w/2-1,-h/2+8,6,15);ctx.fillRect(-w/2-5,h/2-22,6,15);ctx.fillRect(w/2-1,h/2-22,6,15);ctx.fillStyle='#0006';round(-w/2+5,-h/2+7,w+5,h+4,10);let paint=ctx.createLinearGradient(-w/2,0,w/2,0);paint.addColorStop(0,'#18212b');paint.addColorStop(.24,color);paint.addColorStop(.65,color);paint.addColorStop(1,'#29313b');ctx.fillStyle=paint;round(-w/2,-h/2,w,h,9);ctx.fillStyle='#ffffff40';ctx.fillRect(-w*.27,-h*.42,w*.09,h*.17);ctx.fillStyle='#ff3344';ctx.fillRect(-w*.39,h*.39,w*.23,5);ctx.fillRect(w*.16,h*.39,w*.23,5);ctx.fillStyle='#111c2a';round(-w*.36,-h*.25,w*.72,h*.23,4);round(-w*.36,h*.14,w*.72,h*.15,3);ctx.fillStyle=enemy?'#ffb05a':'#fff4a4';ctx.fillRect(-w*.4,-h*.45,w*.24,5);ctx.fillRect(w*.16,-h*.45,w*.24,5);ctx.restore()}function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function start(){pid=null;tx=null;running=true;panel.style.display='none';controls.style.display='none';playerLane=1;playerPos=targetPos=1;stage=selectedStage;objects=[];particles=[];score=0;coinRun=0;elapsed=0;spawn=.6;speed=270;near=0;last=performance.now();requestAnimationFrame(loop)}function move(d){if(!running)return;targetPos=Math.max(0,Math.min(2,targetPos+d));if(navigator.vibrate)navigator.vibrate(9)}function draw(){if(stage>0){let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,['','#07567d','#307ec0','#08091d'][stage]);bg.addColorStop(1,['','#07334e','#a4d9f5','#21113c'][stage]);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<45;i++){let x=(i*137.51)%W,y=(i*79+roadOffset*(stage===3?.25:.5))%H;ctx.fillStyle=stage===3?'#ffffffbb':'#ffffff35';if(stage===3){ctx.fillRect(x,y,2+i%3,2+i%3)}else if(stage===1){ctx.fillRect(x,y,16+i%12,2)}else{ctx.beginPath();ctx.ellipse(x,y,22+i%15,9,0,0,Math.PI*2);ctx.fill()}}}else{let grass=ctx.createLinearGradient(0,0,W,0);grass.addColorStop(0,'#102b24');grass.addColorStop(.5,'#234537');grass.addColorStop(1,'#102b24');ctx.fillStyle=grass;ctx.fillRect(0,0,W,H);ctx.fillStyle='#101820';ctx.fillRect(roadX-8,0,roadW+16,H);let asphalt=ctx.createLinearGradient(roadX,0,roadX+roadW,0);asphalt.addColorStop(0,'#252b36');asphalt.addColorStop(.5,'#414854');asphalt.addColorStop(1,'#252b36');ctx.fillStyle=asphalt;ctx.fillRect(roadX,0,roadW,H);for(let y=(roadOffset%100)-100;y<H;y+=100){ctx.fillStyle='#e4e9ef';ctx.fillRect(roadX-7,y,5,42);ctx.fillRect(roadX+roadW+2,y,5,42)};ctx.fillStyle='#e5d64a';ctx.fillRect(roadX+5,0,4,H);ctx.fillRect(roadX+roadW-9,0,4,H);ctx.fillStyle='#c9ced8';for(let l=1;l<3;l++){let x=roadX+laneW*l;for(let y=(roadOffset%85)-85;y<H;y+=85)ctx.fillRect(x-2,y,4,42)}}for(let o of objects){if(o.type==='coin'){ctx.beginPath();ctx.fillStyle=o.value===5?'#ff8b20':'#ffc833';ctx.arc(laneX(o.lane),o.y,o.value===5?19:14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff2a2';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#92630c';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(o.value===5?'5×':'$',laneX(o.lane),o.y+5)}else car(laneX(o.lane),o.y,o.color,true)}car(laneX(playerPos),H*.78,colors[vehicle]);for(let p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;playerPos+=(targetPos-playerPos)*(1-Math.exp(-22*dt));playerLane=Math.round(playerPos);elapsed+=dt;speed=Math.min(680,270+stage*35+coinRun*3);roadOffset+=speed*dt;score+=dt*(9+elapsed*.2)*(1+stage*.25);spawn-=dt;if(spawn<=0){let lane=Math.floor(Math.random()*3);objects.push({lane,y:-75,type:Math.random()<.25?'coin':'car',color:['#f04e56','#efad38','#8d91ff','#eaeaea'][Math.floor(Math.random()*4)],passed:false});if(objects[objects.length-1].type==='car'&&Math.random()<.38){objects.push({lane,y:-75+(Math.random()<.5?105:-105),type:'coin',value:5,passed:false})}spawn=Math.max(.38,.95-coinRun*.008)+Math.random()*.25}const py=H*.78;for(let o of objects){o.y+=speed*dt;if(Math.abs(o.y-py)<(o.type==='coin'?25:48)&&Math.abs(o.lane-playerPos)<(o.type==='coin'?.36:.48)){if(o.type==='coin'){let v=o.value||1;coinRun+=v;score+=15*v;o.y=H+100;pop(v===5?'RISK BONUS +5 COINS':'+1 COIN')}else{crash();return}}if(o.type==='car'&&Math.abs(o.y-py)<48){let clearance=Math.abs(o.lane-playerPos);if(clearance>=.48&&clearance<.72)o.close=true}if(!o.passed&&o.y>py+52){o.passed=true;if(o.type==='car'&&o.close){score+=12;near++;pop('NEAR MISS +12')}}}objects=objects.filter(o=>o.y<H+110);hudScore.textContent=['ROAD','SEA','AIR','SPACE'][stage]+' · '+Math.floor(score);hudCoins.textContent='🪙 '+(bank+coinRun);draw();requestAnimationFrame(loop)}function crash(){running=false;controls.style.display='none';if(navigator.vibrate)navigator.vibrate([80,50,100]);gameCount++;let final=Math.floor(score);bank+=coinRun;save('dh_bank',bank);if(final>best){best=final;save('dh_best',best)}hudBest.textContent='BEST '+best;hudCoins.textContent='🪙 '+bank;let adDue=gameCount>3&&gameCount%4===0&&Date.now()-adTime>90000;box.innerHTML='<h1>'+(final===best&&final>0?'NEW RECORD!':'YOU CRASHED!')+'</h1><p style="font-size:24px;color:white;font-weight:900">'+final+' POINTS</p><p>+'+coinRun+' coins · '+near+' near misses<br>Best: '+best+'</p><button id="again">TRY AGAIN ↻</button><button class="alt" id="garage2">GARAGE ('+bank+' coins)</button><small>'+(adDue?'Ad break would appear here in the paid app. No real ads in this browser demo.':'One more run?')+'</small>';panel.style.display='flex';document.querySelector('#again').onclick=start;document.querySelector('#garage2').onclick=garage;if(adDue)adTime=Date.now()}function worldsMenu(){let names=['HIGHWAY CAR','SPEEDBOAT','JET','SPACESHIP'],cost=[0,100,300,750];box.innerHTML='<h1>WORLDS</h1><p>Coins: '+bank+'</p>'+names.map((n,i)=>'<button class="alt" data-world="'+i+'">'+n+' — '+(worlds[i]?(selectedStage===i?'SELECTED':'PLAY'):cost[i]+' coins')+'</button>').join('')+'<button id="worldback">BACK</button>';panel.style.display='flex';document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{let i=+b.dataset.world;if(!worlds[i]){if(!worlds[i-1]||bank<cost[i]){b.textContent='Unlock previous world / earn more coins';return}bank-=cost[i];worlds[i]=true;save('dh_worlds',worlds);save('dh_bank',bank);hudCoins.textContent='🪙 '+bank}selectedStage=i;save('dh_world',i);start()});document.querySelector('#worldback').onclick=garage}function garage(){box.innerHTML='<h1>GARAGE</h1><p>Coins: '+bank+' · Choose your ride</p>'+colors.map((c,i)=>'<button class="alt" data-car="'+i+'" style="border-left:12px solid '+c+'">'+['TURQUOISE TERROR','RED ROCKET','PURPLE PROBLEM','GOLDEN IDIOT'][i]+' — '+(owned[i]?(vehicle===i?'SELECTED':'OWNED'):prices[i]+' 🪙')+'</button>').join('')+'<button id="worlds">UNLOCK WORLDS</button><button id="back">BACK TO GAME</button>';panel.style.display='flex';document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{let i=+b.dataset.car;if(owned[i]){vehicle=i;garage()}else if(bank>=prices[i]){bank-=prices[i];owned[i]=true;vehicle=i;save('dh_bank',bank);save('dh_owned',owned);hudCoins.textContent='🪙 '+bank;garage()}else pop('NOT ENOUGH COINS')});document.querySelector('#worlds').onclick=worldsMenu;document.querySelector('#back').onclick=()=>{box.innerHTML='<h1>DON\'T HIT SH!T</h1><p>Change lanes. Dodge idiots. Grab coins.</p><button id="go">PLAY</button>';document.querySelector('#go').onclick=start}}document.querySelector('#play').onclick=start;document.querySelector('#garage').onclick=garage;document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);let tx=null,pid=null;canvas.addEventListener('pointerdown',e=>{if(!running||pid!==null)return;pid=e.pointerId;tx=e.clientX;canvas.setPointerCapture(pid)});canvas.addEventListener('pointermove',e=>{if(!running||e.pointerId!==pid)return;targetPos=Math.max(0,Math.min(2,targetPos+(e.clientX-tx)/laneW*1.35));tx=e.clientX});function release(e){if(e.pointerId===pid){pid=null;tx=null}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '&&!running)start()});draw()})();
