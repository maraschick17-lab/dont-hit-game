services:
  - type: web
    name: dont-hit-scores
    runtime: node
    region: oregon
    plan: free
    rootDir: scores
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /scores
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dont-hit-scores
          property: connectionString
databases:
  - name: dont-hit-scores
    region: oregon
    plan: free
    postgresMajorVersion: "16"
    databaseName: dont_hit_scores
    user: dont_hit_scores_user
