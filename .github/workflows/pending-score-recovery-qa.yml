name: Validate pending leaderboard recovery
on:
  pull_request:
    branches: [main]
    paths: ['leaderboard.js', 'tests/leaderboard-recovery.cjs', '.github/workflows/pending-score-recovery-qa.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/leaderboard-recovery.cjs test.cjs tests/moving-traffic.cjs tests/lane-mileage.cjs tests/endless-fuel-route.cjs tests/weekly-progress.cjs
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/connectivity-mobile.cjs
      - run: node tests/lane-mileage-touch.cjs
      - run: node tests/endless-orbit-smoke.cjs
      - run: node tests/sequential-mobile-smoke.cjs
      - run: node tests/daily-campaign-mobile.cjs
