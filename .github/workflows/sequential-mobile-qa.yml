name: One-shot sequential campaign QA
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths: ['.github/workflows/sequential-mobile-qa.yml']
permissions:
  contents: read
jobs:
  mobile-smoke:
    if: github.event_name == 'push' || github.head_ref == 'engineering/sequential-campaign-vehicle-audio'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/sequential-mobile-smoke.cjs
      - name: Verify deployed release matches tested source (one time on merge)
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "https://dont-hit-game.onrender.com/?qa=$(date +%s)" -o /tmp/rto-live.html && cmp -s index.html /tmp/rto-live.html; then
              echo "Live production HTML matches tested release exactly"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not match this release"
          exit 1
