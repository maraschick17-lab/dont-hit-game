name: Cloud release verification and iOS readiness
on:
  push:
    branches: [engineering/ios-cloud-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c22c1d22c8ed1f1df288a6f6e5e1ea6b99963157
      - name: Match deployed v4.13 public assets against release commit
        shell: bash
        run: |
          set -euo pipefail
          for asset in index.html leaderboard.js manifest.webmanifest icon.svg; do
            path="$asset"
            if [[ "$asset" == index.html ]]; then path=""; fi
            curl --fail --silent --show-error --location --retry 3 --max-time 30 "https://dont-hit-game.onrender.com/${path}?release=c22c1d22c8ed1f1df288a6f6e5e1ea6b99963157" -o "/tmp/live-$asset"
            cmp "$asset" "/tmp/live-$asset"
            sha256sum "/tmp/live-$asset"
          done
          grep -Fq 'v4.13' /tmp/live-index.html
          grep -Fq '<title>RUSH TO ORBIT</title>' /tmp/live-index.html
          echo 'Production v4.13 matches all four release assets; GET only.'
  ios-toolchain:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Verify free standard runner and distribution SDK readiness
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk%%.*}" -ge 27
          xcodebuild -showsdks
          echo 'SDK probe only: no signing, no submission, no secrets.'

  ios-simulator:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate unsigned native project
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          mkdir -p ios/App/Web
          cp index.html leaderboard.js manifest.webmanifest icon.svg ios/App/Web/
          cd ios
          xcodegen generate
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' App/Info.plist
      - name: Build app for simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/RushToOrbit.xcodeproj -scheme RushToOrbit -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run offline native UI smoke
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS-" in k for x in v if x["name"]=="iPhone 18 Pro" and x["isAvailable"]))')"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project ios/RushToOrbit.xcodeproj -scheme RushToOrbit -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath ios/DerivedData -resultBundlePath ios/NativeSmoke.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test
      - name: Preserve unsigned simulator application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rush-to-orbit-unsigned-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/RushToOrbit.app
          retention-days: 3
          if-no-files-found: warn
      - name: Export native failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ios/NativeDiagnostics
          if [[ -d ios/NativeSmoke.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path ios/NativeSmoke.xcresult > ios/NativeDiagnostics/summary.json || true
            xcrun xcresulttool export diagnostics --path ios/NativeSmoke.xcresult --output-path ios/NativeDiagnostics/exported || true
          fi
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rush-to-orbit-native-smoke
          path: |
            ios/NativeSmoke.xcresult
            ios/NativeDiagnostics/
          retention-days: 3
          if-no-files-found: warn
